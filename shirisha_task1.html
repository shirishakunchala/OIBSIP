<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Calculator</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
      transition:0.4s;
    }

    .container{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .calculator{
      width:350px;
      padding:25px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(15px);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
      border:1px solid rgba(255,255,255,0.2);
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .top-bar h2{
      color:white;
      font-size:28px;
    }

    .theme-btn{
      width:45px;
      height:45px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      font-size:18px;
      background:white;
      transition:0.3s;
    }

    .theme-btn:hover{
      transform:scale(1.1);
    }

    #display{
      width:100%;
      height:75px;
      border:none;
      outline:none;
      border-radius:15px;
      padding:15px;
      margin-bottom:20px;
      font-size:32px;
      text-align:right;
      background:rgba(255,255,255,0.15);
      color:white;
    }

    #display::placeholder{
      color:#ddd;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }

    button{
      height:65px;
      border:none;
      border-radius:15px;
      font-size:22px;
      cursor:pointer;
      transition:0.3s;
      background:rgba(255,255,255,0.12);
      color:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    button:hover{
      transform:translateY(-3px);
      background:rgba(255,255,255,0.2);
    }

    button:active{
      transform:scale(0.95);
    }

    .operator{
      background:#ff9800;
      color:white;
    }

    .operator:hover{
      background:#ffb74d;
    }

    .equal{
      background:#00c853;
      color:white;
    }

    .equal:hover{
      background:#32e875;
    }

    /* Light Theme */

    body.light{
      background:linear-gradient(135deg,#f5f7fa,#c3cfe2);
    }

    body.light .calculator{
      background:rgba(255,255,255,0.7);
    }

    body.light #display{
      background:#ffffff;
      color:#222;
    }

    body.light .top-bar h2{
      color:#222;
    }

    body.light button{
      background:#ffffff;
      color:#222;
    }

    body.light button:hover{
      background:#eaeaea;
    }

    @media(max-width:400px){

      .calculator{
        width:100%;
      }

      button{
        height:60px;
        font-size:20px;
      }

      #display{
        font-size:28px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="calculator">

      <div class="top-bar">
        <h2>Calculator</h2>
        <button class="theme-btn" id="themeToggle">🌙</button>
      </div>

      <input type="text" id="display" placeholder="0" disabled>

      <div class="buttons">

        <button class="operator" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('00')">00</button>
        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

      </div>

    </div>

  </div>

  <script>

    const display = document.getElementById("display");
    const themeToggle = document.getElementById("themeToggle");

    /* Add Value */

    function appendValue(value){

      if(display.value === "Error"){
        display.value = "";
      }

      display.value += value;
    }

    /* Clear Display */

    function clearDisplay(){
      display.value = "";
    }

    /* Delete Last Character */

    function deleteLast(){
      display.value = display.value.slice(0,-1);
    }

    /* Calculate Result */

    function calculate(){

      try{

        let expression = display.value;

        expression = expression.replace(/÷/g,'/');
        expression = expression.replace(/×/g,'*');

        let result = eval(expression);

        if(result === Infinity || result === -Infinity){
          display.value = "Error";
        }
        else{
          display.value = result;
        }

      }

      catch{
        display.value = "Error";
      }
    }

    /* Keyboard Support */

    document.addEventListener("keydown",(e)=>{

      const key = e.key;

      if(!isNaN(key) || ['+','-','*','/','.','%'].includes(key)){
        appendValue(key);
      }

      else if(key === "Enter"){
        calculate();
      }

      else if(key === "Backspace"){
        deleteLast();
      }

      else if(key === "Escape"){
        clearDisplay();
      }

    });

    /* Theme Toggle */

    themeToggle.addEventListener("click",()=>{

      document.body.classList.toggle("light");

      if(document.body.classList.contains("light")){
        themeToggle.innerHTML = "☀";
      }
      else{
        themeToggle.innerHTML = "🌙";
      }

    });

  </script>

</body>
</html>
